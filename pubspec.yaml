name: courage_quest
description: Courage Quest — a child-friendly companion for building courage around OCD-related worries.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  fl_chart: ^0.65.0
  video_player: ^2.8.1
  ar_flutter_plugin: ^0.7.3
  permission_handler: ^12.0.0
  intl: ^0.20.2
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

# ar_flutter_plugin 0.7.3 declares permission_handler ^10; we need 12+ for Android (no v1 embedding).
dependency_overrides:
  permission_handler: ^12.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/Icon.jpeg

flutter:
  uses-material-design: true

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf

  assets:
    - assets/images/
    - assets/videos/
