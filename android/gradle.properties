org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Sceneform/ar_flutter_plugin pull com.android.support; Jetifier maps them so they do not clash with AndroidX.
android.enableJetifier=true

# Kotlin incremental compile breaks when Pub cache is on another drive than the project (C: vs D:):
# IllegalArgumentException: this and base files have different roots
kotlin.incremental=false
kotlin.incremental.jvm=false
